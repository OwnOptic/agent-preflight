[project]
name = "agent-preflight"
version = "0.1.0"
description = "Design-time governance for Microsoft agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "jsonschema>=4.22", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
